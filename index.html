<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Golf Model</title>
<style>
  :root { --navy:#1a2744; --red:#c8102e; --accent:#7fcf8f; --bg:#fafafa; --border:#e2e2e2; --row-alt:#eef1f7; --muted:#6b7280; }
  * { box-sizing: border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; margin:0; background:var(--bg); color:#1a1a1a; font-size:12px; font-variant-numeric:tabular-nums; }
  .shell { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff; }
  .header { background:var(--navy); color:#fff; padding:14px 20px; border-bottom:3px solid var(--accent); font-size:16px; font-weight:600; display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  .header .sub { font-size:11px; font-weight:400; opacity:.75; }
  .header .spacer { margin-left:auto; }
  button, select, input[type=text], input[type=number] { font:inherit; }
  .btn { padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:#fff; font-size:12px; cursor:pointer; color:#1a1a1a; }
  .btn:hover { background:#f1f3f8; }
  .btn.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:700; }
  .btn.primary:hover { background:#a80d26; }
  .header .btn { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25); color:#fff; }
  .header .btn.primary { background:var(--red); border-color:var(--red); }
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 14px; background:#fff; border-bottom:1px solid var(--border); }
  .toolbar input[type=text], .toolbar select, .toolbar input[type=number] { padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:12px; background:#fff; }
  .toolbar input[type=number] { width:64px; padding:6px 6px; }
  .toolbar label { font-size:11px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:.4px; }
  .toolbar .grow { flex:1 1 140px; min-width:120px; }
  /* weights */
  .wpanel { display:none; padding:12px 14px 14px; background:#f6f7fb; border-bottom:1px solid var(--border); max-height:420px; overflow-y:auto; }
  .wpanel.open { display:block; }
  .wtop { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; }
  .wtop .note { font-size:11px; color:var(--muted); font-style:italic; }
  .wtotal { font-weight:700; color:var(--navy); }
  .wcard.collapsed .wrow { display:none; }
  .wcard.collapsed h4 b::after { content:" ▸ (not in default model)"; font-weight:500; color:#8a90a2; font-size:11px; }
  .wgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; }
  .wcard { background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  .wcard h4 { margin:0 0 6px; font-size:12px; color:var(--navy); display:flex; justify-content:space-between; gap:6px; }
  .wcard h4 span { color:var(--muted); font-weight:600; }
  .wrow { display:grid; grid-template-columns:118px 1fr 44px; align-items:center; gap:8px; padding:2px 0; }
  .wrow .lab { font-size:11px; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wrow input[type=range] { width:100%; accent-color:var(--navy); }
  .wrow .val { text-align:right; font-weight:700; font-size:11px; }
  .spanel { display:none; position:absolute; z-index:20; top:34px; left:0; background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px; box-shadow:0 4px 16px rgba(0,0,0,.12); min-width:230px; max-height:320px; overflow-y:auto; }
  .spanel.open { display:block; }
  .spanel label { display:block; font-size:12px; padding:3px 0; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:400; color:#1a1a1a; }
  .spanel .acts { display:flex; gap:6px; margin-bottom:6px; }
  body.dark .spanel { background:#1a2030; border-color:#2c3448; } body.dark .spanel label { color:#e4e6ec; }
  /* table */
  .table-wrap { overflow:auto; max-height:640px; position:relative; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  thead th { position:sticky; top:0; background:var(--navy); z-index:2; padding:8px 8px; text-align:center; border-bottom:3px solid var(--accent); cursor:pointer; user-select:none; font-weight:700; color:#fff; text-transform:uppercase; font-size:11px; letter-spacing:.4px; white-space:nowrap; }
  thead th:nth-child(2) { text-align:left; position:sticky; left:0; z-index:3; }
  .arrow { font-size:10px; color:var(--accent); margin-left:3px; }
  tbody td { padding:8px 9px; border-bottom:1px solid var(--border); text-align:center; white-space:nowrap; }
  tbody td.name { text-align:left; font-weight:700; position:sticky; left:0; background:inherit; z-index:1; min-width:150px; }
  tbody td.idx { color:var(--muted); font-weight:700; width:34px; }
  tbody tr.g { background:#fff; cursor:pointer; }
  tbody tr.g:nth-child(4n+1) { background:var(--row-alt); }
  tbody tr.g:hover td { filter:brightness(.96); }
  tbody tr.wd td { opacity:.45; }
  .tag { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:9px; font-size:10px; font-weight:700; background:#888; color:#fff; }
  .up { color:#0f7a3a; font-weight:700; } .down { color:#b3261e; font-weight:700; } .flat { color:var(--muted); }
  tr.detail td { padding:10px 14px; background:#f6f7fb; text-align:left; white-space:normal; }
  .dgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px 14px; }
  .dgrid .it { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:11px; }
  .dgrid .chip { min-width:38px; text-align:center; padding:2px 6px; border-radius:4px; font-weight:700; }
  .dgrid .gh { grid-column:1/-1; font-weight:800; color:var(--navy); text-transform:uppercase; font-size:10px; letter-spacing:.5px; margin-top:4px; }
  .footer { font-size:12px; font-style:italic; color:var(--muted); padding:6px 10px; }
  .warn { display:none; margin:8px 14px 0; padding:7px 10px; border-radius:6px; background:#fff4d6; border:1px solid #f0d58a; color:#6b4e00; font-size:12px; }
  .fail { padding:24px; text-align:center; color:#999; }
  body.dark { background:#10141f; color:#e4e6ec; }
  body.dark .shell, body.dark .toolbar, body.dark .wcard, body.dark .btn, body.dark .toolbar input, body.dark .toolbar select { background:#1a2030; border-color:#2c3448; color:#e4e6ec; }
  body.dark .wpanel, body.dark tr.detail td { background:#151b2a; }
  body.dark tbody tr.g { background:#1a2030; } body.dark tbody tr.g:nth-child(4n+1) { background:#212a3d; }
  body.dark tbody td { border-bottom-color:#2c3448; color:#e4e6ec; }
  body.dark .wcard h4, body.dark .dgrid .gh, body.dark .toolbar label, body.dark .wtotal { color:#e4e6ec; }
  body.dark .wrow .lab { color:#c4c9d6; }
  @media (max-width:520px) { .wgrid { grid-template-columns:1fr; } .wrow { grid-template-columns:96px 1fr 40px; } }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <span id="title">Golf Model</span>
    <span class="sub" id="updated"></span>
    <span class="spacer"></span>
    <button class="btn" id="themeBtn" title="Toggle dark mode">🌙</button>
    <button class="btn primary" id="exportBtn">⬇ Export CSV</button>
  </div>
  <div class="toolbar">
    <input type="text" id="search" class="grow" placeholder="Search golfer...">
    <button class="btn" id="wBtn">⚙ Weights</button>
    <span style="position:relative;"><button class="btn" id="stBtn">Stats ▾</button><div class="spanel" id="spanel"></div></span>
    <label for="scaleSel">fpts</label>
    <select id="scaleSel">
      <option value="rating">Rating as-is</option>
      <option value="scaled">Scaled to points range</option>
    </select>
    <span id="scaleBox" style="display:none;align-items:center;gap:6px;">
      <label>Floor</label><input type="number" id="floor" step="0.5">
      <label>Top</label><input type="number" id="ceil" step="0.5">
    </span>
  </div>
  <div class="wpanel" id="wpanel">
    <div class="wtop">
      <button class="btn" id="resetBtn">Reset to default weights</button>
      <span class="wtotal" id="wtotal"></span>
      <span class="note">Weights are scaled to add up to 100%, so only the balance between stats matters.</span>
    </div>
    <div class="wgrid" id="wgrid"></div>
  </div>
  <div class="warn" id="warn"></div>
  <div class="table-wrap" id="tableWrap">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
  <div class="footer">Click a golfer to see the score behind each stat. Ratings come from each stat's z-score within the field, weighted by the settings above (average golfer = 50).</div>
</div>

<script>
// ---------- colors (same scale as the NFL First Look) ----------
const STOPS=[[0,[178,24,43]],[1/6,[239,138,98]],[2/6,[253,219,199]],[3/6,[247,247,247]],[4/6,[209,229,240]],[5/6,[103,169,207]],[1,[33,102,172]]];
const lerp=(a,b,t)=>a+(b-a)*t;
function gradientColor(p){
  p=Math.max(0,Math.min(1,p)); let lo=STOPS[0],hi=STOPS[STOPS.length-1];
  for(let i=0;i<STOPS.length-1;i++){ if(p>=STOPS[i][0]&&p<=STOPS[i+1][0]){lo=STOPS[i];hi=STOPS[i+1];break;} }
  const t=(p-lo[0])/((hi[0]-lo[0])||1);
  const r=Math.round(lerp(lo[1][0],hi[1][0],t)),g=Math.round(lerp(lo[1][1],hi[1][1],t)),b=Math.round(lerp(lo[1][2],hi[1][2],t));
  return {bg:`rgb(${r},${g},${b})`,text:(0.299*r+0.587*g+0.114*b)>150?"black":"white"};
}
// percentile position of each value within an array of numbers (ties share a position)
function percentiles(vals){
  const idx=vals.map((v,i)=>[i,v]).filter(([,v])=>v!==null&&v!==undefined&&!isNaN(v)).sort((a,b)=>a[1]-b[1]);
  const out=new Array(vals.length).fill(null), n=idx.length; let i=0;
  while(i<n){ let j=i; while(j+1<n&&idx[j+1][1]===idx[i][1]) j++; const p=n>1?((i+j)/2)/(n-1):.5; for(let k=i;k<=j;k++) out[idx[k][0]]=p; i=j+1; }
  return out;
}

// ---------- state ----------
let D=null, W=[], W0=[], sortKey="rating", sortDir=-1, search="", scaleMode="rating", floorV=11, ceilV=50.5;
let rows=[], defaultRank={}, openRows=new Set();
const $=id=>document.getElementById(id);
const fmt=(v,d=1)=>(v===null||v===undefined||isNaN(v))?"—":Number(v).toFixed(d);
const money=v=>v?("$"+Number(v).toLocaleString()):"—";
const pct=v=>(v===null||v===undefined)?"—":(Number(v)*100).toFixed(1)+"%";
const american=v=>{ if(v===null||v===undefined) return "—"; return v>0?("+"+v):String(v); };
const winAm=v=>v===null||v===undefined?"—":"+"+Math.round(v*100);

const Z_CAP=3, Z_MISSING=-3, RATE_MID=50, RATE_SPREAD=18;
const DEBUT_Z=-0.25;   // z-score for a golfer with no course history (a slight penalty for debutants)
// Inverse normal CDF (Acklam approximation)
function invNorm(p){
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425; let q,r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p>1-pl){ q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
// Market-implied strength: where a golfer ranks on win and top-10 odds, converted to a z-score.
// It stands in for any stat the golfer has no data for (e.g. Japan Tour players with no PGA Tour rounds).
function buildMarketZ(){
  const n=D.golfers.length;
  // sportsbook odds -> implied probability (win odds are X-to-1; top-10 odds are American)
  D.golfers.forEach(g=>{
    g._bw=(g.winOdds!==null&&g.winOdds!==undefined&&g.winOdds>=0)?1/(g.winOdds+1):null;
    const a=g.t10Odds; g._bt=(a===null||a===undefined||a===0)?null:(a>0?100/(a+100):-a/(-a+100));
  });
  const rk=k=>{ const o=D.golfers.map((g,i)=>[i,g[k]]).filter(([,v])=>v!==null&&v!==undefined).sort((a,b)=>b[1]-a[1]); const out={}; o.forEach(([i],j)=>out[i]=j+1); return out; };
  const R=["winP","t10P","_bw","_bt"].map(rk);
  D.golfers.forEach((g,i)=>{
    const rs=R.map(m=>m[i]).filter(x=>x!==undefined);
    if(!rs.length){ g.mz=null; return; }
    const r=rs.reduce((a,b)=>a+b,0)/rs.length;
    g.mz=invNorm(Math.min(0.98,Math.max(0.02,(n-r+0.5)/n)));
  });
}
// Weighted average of the stat z-scores (capped at +/-3). Missing stats use the golfer's market-implied z (from win/top-10 odds); with no odds they count as the floor.
// No data for a stat: no course history gets a slight penalty (DEBUT_Z);
// every other stat uses the market-implied z from odds, or the floor when there are no odds.
function missingZ(g,i){
  if(D.stats[i].group==="Course History") return DEBUT_Z;
  return (g.mz===null||g.mz===undefined)?Z_MISSING:g.mz;
}
function composite(g,w,tot){
  if(!tot) return 0;
  let s=0; for(let i=0;i<w.length;i++){ const z=g.z[i]; s+=w[i]*(z===null||z===undefined?missingZ(g,i):Math.max(-Z_CAP,Math.min(Z_CAP,z))); }
  return s/tot;
}
function compute(){
  const tot=W.reduce((a,b)=>a+b,0);
  rows=D.golfers.map((g,i)=>({g,i,comp:composite(g,W,tot)}));
  const live=rows.filter(r=>!r.g.wd), n=live.length||1;
  const mean=live.reduce((a,r)=>a+r.comp,0)/n;
  const sd=Math.sqrt(live.reduce((a,r)=>a+(r.comp-mean)*(r.comp-mean),0)/Math.max(n-1,1));
  // re-standardize across the field so the rating always runs on the same 0-100 style scale as weights change
  rows.forEach(r=>{ r.rating=r.g.wd?0:(sd>1e-9?RATE_MID+RATE_SPREAD*(r.comp-mean)/sd:RATE_MID)+(r.g.adj||0); });
  const mx=Math.max(...live.map(r=>r.rating),0)||1;
  rows.forEach(r=>{
    if(r.g.wd){ r.fpts=0; return; }
    r.fpts=scaleMode==="scaled"? floorV+(ceilV-floorV)*(r.rating/mx) : r.rating;
  });
  [...live].sort((a,b)=>b.rating-a.rating).forEach((r,k)=>{ r.rank=k+1; });
  rows.forEach(r=>{ if(r.g.wd) r.rank=null; r.dkVal=r.g.dk&&!r.g.wd?r.rating/(r.g.dk/1000):null; r.fdVal=r.g.fd&&!r.g.wd?r.rating/(r.g.fd/1000):null; r.chg=(r.rank&&defaultRank[r.i])?defaultRank[r.i]-r.rank:null; });
  const pr=percentiles(live.map(r=>r.rating)); live.forEach((r,k)=>r.pRating=pr[k]);
  const pd=percentiles(rows.map(r=>r.dkVal)), pf=percentiles(rows.map(r=>r.fdVal));
  rows.forEach((r,k)=>{ r.pDk=pd[k]; r.pFd=pf[k]; });
}

// ---------- table ----------
const BASE_COLS=[
  {k:"rank",l:"#",idx:true},
  {k:"name",l:"Golfer",name:true},
  {k:"rating",l:"Rating",heat:"pRating",f:r=>fmt(r.rating,1)},
  {k:"chg",l:"Chg",f:r=>r.chg===null?"—":r.chg>0?`▲${r.chg}`:r.chg<0?`▼${-r.chg}`:"–",cls:r=>r.chg>0?"up":r.chg<0?"down":"flat"},
  {k:"fpts",l:"fpts",f:r=>fmt(r.fpts,2)},
  {k:"dk",l:"DK $",f:r=>money(r.g.dk)},
  {k:"dkOwn",l:"DK Own",f:r=>pct(r.g.dkOwn)},
  {k:"dkVal",l:"DK Val",heat:"pDk",f:r=>fmt(r.dkVal,2)},
  {k:"fd",l:"FD $",f:r=>money(r.g.fd)},
  {k:"fdOwn",l:"FD Own",f:r=>pct(r.g.fdOwn)},
  {k:"fdVal",l:"FD Val",heat:"pFd",f:r=>fmt(r.fdVal,2)},
  {k:"winOdds",l:"Win",f:r=>winAm(r.g.winOdds)},
  {k:"t10Odds",l:"Top 10",f:r=>american(r.g.t10Odds)}
];
let COLS=BASE_COLS.slice(), shownStats=new Set(), STAT_DEC=[];
function buildCols(){
  COLS=[]; BASE_COLS.forEach(c=>{
    COLS.push(c);
    if(c.k==="fpts") D.stats.forEach((st,i)=>{ if(shownStats.has(i)) COLS.push({k:"st"+i,l:st.group.replace("SG: ","SG ")+" "+st.label,stat:i}); });
  });
}
function statText(r,i){
  const rk=r.g.r[i];
  return rk?("#"+rk):"— (odds est.)";
}
function val(r,k){
  if(/^st\d+$/.test(k)){ const x=r.g.r[+k.slice(2)]; return x?-x:null; }
  if(k==="name") return r.g.name;
  if(k==="dk"||k==="fd"||k==="dkOwn"||k==="fdOwn"||k==="winOdds"||k==="t10Odds") return r.g[k];
  return r[k];
}
function renderHead(){
  const hr=$("headRow"); hr.innerHTML="";
  COLS.forEach(c=>{
    const th=document.createElement("th"); th.textContent=c.l;
    if(sortKey===c.k){ const a=document.createElement("span"); a.className="arrow"; a.textContent=sortDir===1?"▲":"▼"; th.appendChild(a); }
    th.onclick=()=>{ if(sortKey===c.k) sortDir*=-1; else { sortKey=c.k; sortDir=(c.k==="name"||c.k==="rank")?1:-1; } render(); };
    hr.appendChild(th);
  });
}
function detailRow(r){
  const tr=document.createElement("tr"); tr.className="detail";
  const td=document.createElement("td"); td.colSpan=COLS.length;
  const tot=W.reduce((a,b)=>a+b,0)||1, nG=D.golfers.length; let last=null, html='<div class="dgrid">';
  D.stats.forEach((s,i)=>{
    if(s.group!==last){ html+=`<div class="gh">${s.group}</div>`; last=s.group; }
    const rk=r.g.r[i], c=rk?gradientColor(1-(rk-1)/(nG-1||1)):{bg:"#ddd",text:"#555"};
    html+=`<div class="it"><span>${s.label} <span style="color:#888">(${(W[i]/tot*100).toFixed(1)}%)</span></span><span class="chip" style="background:${c.bg};color:${c.text}">${statText(r,i)}</span></div>`;
  });
  td.innerHTML=html+"</div>"; tr.appendChild(td); return tr;
}
function render(){
  renderHead();
  let list=rows.slice();
  if(search){ const t=search.toLowerCase(); list=list.filter(r=>r.g.name.toLowerCase().includes(t)); }
  list.sort((a,b)=>{
    let av=val(a,sortKey), bv=val(b,sortKey);
    if(a.g.wd!==b.g.wd) return a.g.wd?1:-1;
    if(av===null||av===undefined) av=-Infinity; if(bv===null||bv===undefined) bv=-Infinity;
    return (typeof av==="string"?av.localeCompare(bv):(av-bv))*sortDir;
  });
  const tb=$("bodyRows"); tb.innerHTML="";
  list.forEach(r=>{
    const tr=document.createElement("tr"); tr.className="g"+(r.g.wd?" wd":"");
    COLS.forEach(c=>{
      const td=document.createElement("td");
      if(c.idx){ td.className="idx"; td.textContent=r.rank===null?"—":r.rank; }
      else if(c.name){ td.className="name"; td.textContent=r.g.name; if(r.g.wd){ const t=document.createElement("span"); t.className="tag"; t.textContent="WD"; td.appendChild(t); } }
      else if(c.stat!==undefined){
        td.textContent=statText(r,c.stat);
        const rk=r.g.r[c.stat];
        if(rk&&!r.g.wd){ const g=gradientColor(1-(rk-1)/(D.golfers.length-1||1)); td.style.background=g.bg; td.style.color=g.text; }
      }
      else {
        td.textContent=c.f(r);
        if(c.cls){ const k=c.cls(r); if(k) td.className=k; }
        if(c.heat&&r[c.heat]!==null&&r[c.heat]!==undefined&&!r.g.wd){ const g=gradientColor(r[c.heat]); td.style.background=g.bg; td.style.color=g.text; td.style.fontWeight="700"; }
      }
      tr.appendChild(td);
    });
    tr.onclick=()=>{ if(openRows.has(r.i)) openRows.delete(r.i); else openRows.add(r.i); render(); };
    tb.appendChild(tr);
    if(openRows.has(r.i)) tb.appendChild(detailRow(r));
  });
}
function recalc(){ compute(); render(); updateWTotals(); }

// ---------- weights panel ----------
function buildWeights(){
  const grid=$("wgrid"); grid.innerHTML=""; const groups={};
  D.stats.forEach((s,i)=>{ (groups[s.group]=groups[s.group]||[]).push(i); });
  Object.keys(groups).forEach(gn=>{
    const card=document.createElement("div"); card.className="wcard";
    const h=document.createElement("h4"); h.innerHTML=`<b>${gn}</b><span data-gt="${gn}"></span>`; card.appendChild(h);
    const unused=groups[gn].every(i=>!W0[i]); if(unused){ card.classList.add("collapsed"); h.title="Not in the default model. Click to add weight."; }
    h.style.cursor="pointer"; h.onclick=()=>card.classList.toggle("collapsed");
    groups[gn].forEach(i=>{
      const row=document.createElement("div"); row.className="wrow";
      row.innerHTML=`<span class="lab" title="${D.stats[i].label}">${D.stats[i].label}</span><input type="range" min="0" max="25" step="0.5" value="${W[i]}"><span class="val"></span>`;
      const inp=row.querySelector("input"), v=row.querySelector(".val");
      inp.oninput=()=>{ W[i]=parseFloat(inp.value); recalc(); };
      row._sync=()=>{ inp.value=W[i]; v.textContent=fmtShare(i); };
      card.appendChild(row);
    });
    grid.appendChild(card);
  });
  updateWTotals();
}
function fmtShare(i){ const t=W.reduce((a,b)=>a+b,0); return t?(W[i]/t*100).toFixed(1)+"%":"0%"; }
function updateWTotals(){
  const t=W.reduce((a,b)=>a+b,0);
  $("wtotal").textContent="Total weight: "+t.toFixed(1)+" → scaled to 100%";
  document.querySelectorAll(".wrow").forEach(r=>r._sync&&r._sync());
  const groups={}; D.stats.forEach((s,i)=>{ groups[s.group]=(groups[s.group]||0)+W[i]; });
  document.querySelectorAll("[data-gt]").forEach(el=>{ el.textContent=t?(groups[el.dataset.gt]/t*100).toFixed(1)+"%":"0%"; });
}

// ---------- export ----------
function csvCell(v){ v=String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCsv(){
  const list=rows.slice().sort((a,b)=>b.fpts-a.fpts||a.g.name.localeCompare(b.g.name));
  const missing=list.filter(r=>!r.g.rg_id);
  if(missing.length){
    if(!confirm(missing.length+" of "+list.length+" golfers have no RG ID in this data and will be exported with a blank rg_id. Export anyway?")) return;
  }
  const lines=["rg_id,name,fpts"];
  list.forEach(r=>lines.push([r.g.rg_id||"",r.g.name,(r.g.wd?0:r.fpts).toFixed(2)].map(csvCell).join(",")));
  const blob=new Blob([lines.join("\r\n")+"\r\n"],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="golf_"+(D.slug||"model")+".csv"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// ---------- wiring ----------
$("search").oninput=e=>{ search=e.target.value; render(); };
$("wBtn").onclick=()=>$("wpanel").classList.toggle("open");
$("stBtn").onclick=e=>{ e.stopPropagation(); $("spanel").classList.toggle("open"); };
document.addEventListener("click",e=>{ if(!$("spanel").contains(e.target)) $("spanel").classList.remove("open"); });
function buildStatsPanel(){
  const sp=$("spanel"); sp.innerHTML='<div class="acts"><button class="btn" id="stAll">All</button><button class="btn" id="stNone">None</button></div>';
  const groups=[]; D.stats.forEach((st,i)=>{ let g=groups.find(x=>x.n===st.group); if(!g){ g={n:st.group,idx:[]}; groups.push(g); } g.idx.push(i); });
  groups.forEach(g=>{
    const lab=document.createElement("label"), cb=document.createElement("input"); cb.type="checkbox"; cb.dataset.g=g.n;
    cb.onchange=()=>{ g.idx.forEach(i=>cb.checked?shownStats.add(i):shownStats.delete(i)); buildCols(); render(); };
    lab.appendChild(cb); lab.appendChild(document.createTextNode(" "+g.n+" ("+g.idx.length+")")); sp.appendChild(lab);
  });
  $("stAll").onclick=()=>{ D.stats.forEach((_,i)=>shownStats.add(i)); sp.querySelectorAll("input").forEach(c=>c.checked=true); buildCols(); render(); };
  $("stNone").onclick=()=>{ shownStats.clear(); sp.querySelectorAll("input").forEach(c=>c.checked=false); buildCols(); render(); };
}
$("resetBtn").onclick=()=>{ W=W0.slice(); recalc(); };
$("exportBtn").onclick=exportCsv;
$("scaleSel").onchange=e=>{ scaleMode=e.target.value; $("scaleBox").style.display=scaleMode==="scaled"?"inline-flex":"none"; recalc(); };
$("floor").oninput=e=>{ floorV=parseFloat(e.target.value)||0; recalc(); };
$("ceil").oninput=e=>{ ceilV=parseFloat(e.target.value)||0; recalc(); };
$("themeBtn").onclick=()=>{ const d=!document.body.classList.contains("dark"); document.body.classList.toggle("dark",d); $("themeBtn").textContent=d?"☀️":"🌙"; };

const qp=new URLSearchParams(location.search);
const KEY=(qp.get("k")||"").trim();
function fail(msg){ $("bodyRows").innerHTML='<tr><td colspan="13" class="fail">'+msg+'</td></tr>'; }
(/^[A-Za-z0-9]{16,64}$/.test(KEY)
  ? fetch("d/"+KEY+".json?v="+Date.now()).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  : Promise.reject(new Error("nokey"))
).then(d=>{
  D=d; W0=d.stats.map(s=>s.w); W=W0.slice();
  floorV=d.scale&&d.scale.floor!=null?d.scale.floor:11; ceilV=d.scale&&d.scale.ceiling!=null?d.scale.ceiling:50.5;
  $("floor").value=floorV; $("ceil").value=ceilV;
  $("title").textContent=d.event||"Golf Model";
  if(d.updated){ const t=new Date(d.updated); if(!isNaN(t)) $("updated").textContent="Updated "+t.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:"America/New_York",timeZoneName:"short"}); }
  buildMarketZ(); compute(); rows.forEach(r=>{ if(r.rank) defaultRank[r.i]=r.rank; }); compute();
  STAT_DEC=D.stats.map((_,i)=>{ const m=Math.max(...D.golfers.map(g=>Math.abs(g.v[i]===null?0:g.v[i]))); return m<5?2:(m<100?1:0); });
  buildStatsPanel(); buildCols(); buildWeights(); render();
  const miss=d.golfers.filter(g=>!g.rg_id).length;
  if(miss){ const w=$("warn"); w.style.display="block"; w.textContent=miss+" of "+d.golfers.length+" golfers have no RG ID, so the export will have blank rg_id values for them."; }
}).catch(e=>{ fail(e.message==="nokey"?"This link is incomplete. Please use the full link from the RotoGrinders page.":"Could not load this week's data ("+e.message+"). Please check that you are using the latest link."); console.error(e); });
</script>
